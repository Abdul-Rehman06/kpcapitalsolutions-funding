<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
  <title id="title">KP Capital Solutions</title>
  <desc id="desc">KP Capital Solutions horizontal logo with shield and tagline</desc>
  <style>
    .gold{fill:#C99B4D}.white{fill:#FFFFFF}.navy{fill:#002369}
    .goldStroke{fill:none;stroke:#C99B4D;stroke-width:4;stroke-linecap:square}
    .divider{fill:none;stroke:#C99B4D;stroke-width:2}
    .capital{font-family:Georgia,'Times New Roman',serif;font-size:54px;font-weight:700;letter-spacing:10px}
    .solutions{font-family:Georgia,'Times New Roman',serif;font-size:43px;font-weight:400;letter-spacing:7px}
    .tagline{font-family:Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:4px}
  </style>

  <!-- Wider, proportionally balanced shield -->
  <g transform="translate(4 4) scale(.43 .38)">
    <path class="gold" d="M210,12l180,60v166c0,115-68,202-180,250C98,440,30,353,30,238V72L210,12z"/>
    <path class="white" d="M210,29l162,54v155c0,104-60,183-162,229C108,421,48,342,48,238V83L210,29z"/>
    <path class="navy" d="M210,45l145,49v144c0,94-53,165-145,208C118,403,65,332,65,238V94L210,45z"/>
    <text x="118" y="282" class="gold" style="font-family:Georgia,'Times New Roman',serif;font-size:132px;font-weight:700">K</text>
    <text x="211" y="282" class="white" style="font-family:Georgia,'Times New Roman',serif;font-size:132px;font-weight:700">P</text>
  </g>

  <line class="divider" x1="198" y1="28" x2="198" y2="184"/>

  <!-- Centered wordmark -->
  <g>
    <text x="545" y="78" text-anchor="middle" class="white capital">CAPITAL</text>
    <line class="goldStroke" x1="230" y1="121" x2="300" y2="121"/>
    <text x="545" y="137" text-anchor="middle" class="gold solutions">SOLUTIONS</text>
    <line class="goldStroke" x1="790" y1="121" x2="860" y2="121"/>
    <text x="545" y="178" text-anchor="middle" class="white tagline">TRUSTED ADVISORS. POWERFUL SOLUTIONS.</text>
  </g>
</svg>
